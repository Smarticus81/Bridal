[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# /api/healthz answers 200 as soon as the process is listening, so a deploy
# goes green even while optional providers (Stripe, Resend, Clerk) are still
# unconfigured. /api/readyz remains the strict production probe: it returns
# 503 until DB + storage + AI + billing + email + model-chain checks all pass.
# Point the healthcheck back at /api/readyz for the final launch cutover.
healthcheckPath = "/api/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
