[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# /api/readyz returns 503 until DB + storage + AI + model-chain checks pass, so
# Railway holds traffic off a replica until it is genuinely ready.
healthcheckPath = "/api/readyz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
